[package]
name = "gray-context"
version = "0.2.0"
edition = "2024"
description = "Merged context plugin for the gray agent harness: truncate, compact, cacheopt, header, context-pin, resources, rules, include, dirty-guard, gh-issues in one sidecar."
license = "MIT"

[[bin]]
name = "context"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
